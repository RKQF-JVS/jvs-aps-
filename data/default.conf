server {
  listen 80;
  server_name localhost;
  add_header X-Content-Type-Options nosniff;
  charset utf-8;
  client_header_buffer_size 1024k;
  large_client_header_buffers 4 1024k;
  client_max_body_size 50m;
  #前端
  root /usr/share/nginx/html/;

  # 跳转至登录页
  location = / {
      index index.html;
      try_files /usr/share/nginx/html /jvs-ui/index.html;
  }

  location ^~ /jvs-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }

  location ^~ /jvs-upms-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }


 location ^~ /jvs-print-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }

  location ^~ /page-design-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }

  location ^~ /jvs-iconmanage-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }

  location ^~ /rule-design-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }

  location ^~ /flowable-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }

  location ^~ /jvs-report-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }


  location ^~ /jvs-document-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }


  location ^~ /weixin-mp-ui/ {
      index index.html ;
      try_files $uri $uri/ /jvs-ui/index.html;
  }



   #静态资源
  location ^~ /static/ {
      root /usr/share/nginx/html/;
  }

  location ^~ /jvs-ui-public/ {
      root /usr/share/nginx/html/;
  }
  
  #此配置用于 拦截 富文本中的 图片与视频 防止 环境变更后 需要重新修改地址
  location /jvs-public/ {
    proxy_set_header X-Forwarded-Port $Server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://jvs-minio:9000/jvs-public/;
    proxy_hide_header X-Frame-Options;   # 避免出现多个X-Frame-Options属性
    add_header X-Frame-Options ALLOWALL; # 将之前网页的SAMEORIGIN属性给替换了，可以嵌套了
  }

  #其它路径全部代理到网关接口中
  location /icon/ {
    proxy_cookie_path /jvs-knowledge-ui /jvs-knowledge-ui;
    proxy_cookie_path / /;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-real-ip $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://jvs-gateway:10000/icon/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection  upgrade;
  }

  #其它路径全部代理到网关接口中
  location /api/ {
    proxy_cookie_path /jvs-ui /jvs-ui;
    proxy_cookie_path / /;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-real-ip $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_pass http://jvs-gateway:10000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection  upgrade;
  }

   #其它路径全部代理到网关接口中
  location / {
    proxy_cookie_path /jvs-ui /jvs-ui;
    proxy_cookie_path / /;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-real-ip $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_pass http://jvs-gateway:10000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection  upgrade;
  }

}