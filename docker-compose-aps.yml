version: '3'
services:
  jvs-aps-mgr:
    restart: always
    image: ${dockerName}/jvs-aps-mgr:${JVSVERSION}
    container_name: jvs-aps-mgr
    environment:
      nacosAddr: ${nacosAddr}
      namespace: ${namespace}
      skyip: ${skyip}
      authentication: ${authentication}
      skywalkingPath: ${skywalkingPath}
      JAVA_OPTS: ${JAVA_OPTS} -Dserver.port=31010
    ports:
      - 31010:31010
    volumes:
      - ./data/nacos/:/root/nacos/config
      - ./data/log/:/log
  jvs-aps-ui:
    restart: always
    image: ${dockerName}/jvs-aps-ui:${JVSVERSION}
    container_name: jvs-aps-ui
    ports:
      - 9998:80
#桥接网络
networks:
  proxy:
    ipam:
      config:
        - subnet: 10.0.0.1/24